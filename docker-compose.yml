services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./models/streaming/kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20
  elasticsearch:
    profiles: [monitoring]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    mem_limit: 1g
    ports: ["127.0.0.1:19200:9200"]
    volumes: ["elastic-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -Eq 'yellow|green'"]
      interval: 10s
      timeout: 5s
      retries: 24
  logstash:
    profiles: [monitoring]
    image: docker.elastic.co/logstash/logstash:8.17.3
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: "1"
      PIPELINE_BATCH_SIZE: "50"
      QUEUE_TYPE: persisted
      QUEUE_MAX_BYTES: 128mb
      QUEUE_PAGE_CAPACITY: 16mb
      QUEUE_CHECKPOINT_WRITES: "1"
    mem_limit: 768m
    depends_on:
      elasticsearch: {condition: service_healthy}
    volumes:
      - ./util/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./models/streaming/logs:/logs:ro
      - logstash-data:/usr/share/logstash/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines/main > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
  kibana:
    profiles: [monitoring]
    image: docker.elastic.co/kibana/kibana:8.17.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 768m
    depends_on:
      elasticsearch: {condition: service_healthy}
    ports: ["127.0.0.1:15601:5601"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24

volumes:
  elastic-data:
  logstash-data:
