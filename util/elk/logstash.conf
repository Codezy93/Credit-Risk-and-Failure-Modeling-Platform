input {
  file {
    path => "/logs/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/credit-risk.sincedb"
    codec => json { ecs_compatibility => "disabled" }
    ecs_compatibility => "disabled"
    stat_interval => "1 second"
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "credit-risk-monitoring-%{+YYYY.MM.dd}"
    document_id => "%{log_id}"
    manage_template => false
    ilm_enabled => false
    ecs_compatibility => "disabled"
  }
}
